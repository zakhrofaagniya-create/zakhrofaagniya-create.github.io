<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Operasional</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 35px;
            font-family: Arial, sans-serif;

            /* BACKGROUND SAMA DENGAN BERANDA */
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #111;
        }

        /* LOGO */
        .logo {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .api {
            color: red;
            font-size: 65px;
            line-height: 35px;
        }

        .kopi {
            color: #0878bd;
            font-size: 90px;
            line-height: 80px;
        }

        /* MENU */
        .menu {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 35px;
        }

        .menu a {
            color: #551a8b;
            font-size: 20px;
        }

        /* GARIS */
        hr {
            border: none;
            border-top: 1px solid #999;
            margin-bottom: 30px;
        }

        /* JUDUL */
        h1 {
            font-size: 36px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 45px;
        }

        /* TABEL */
        table {
            border-collapse: collapse;
            width: 310px;
            background-color: rgba(255, 255, 255, 0.85);
        }

        th,
        td {
            border: 1px solid #333;
            padding: 16px;
            font-size: 20px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-weight: normal;
        }

        /* CATATAN */
        .catatan {
            font-style: italic;
            line-height: 1.8;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            color: #777;
            font-size: 17px;
            margin-top: 65px;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <div class="logo">
        <div class="api">〰</div>
        <div class="kopi">☕</div>
    </div>

    <!-- MENU -->
    <div class="menu">
        <a href="index.html">Beranda</a>
        |
        <a href="jadwal.html">Jadwal Operasional</a>
        <br><a href="menu.html">Kembali Ke Menu Utama</a>
    </div>

    <hr>

    <!-- JUDUL -->
    <h1>Jam Operasional Kedai</h1>

    <!-- TABEL JADWAL -->
    <table>

        <tr>
            <th>Hari</th>
            <th>Jam<br>Buka</th>
        </tr>

        <tr>
            <td>Senin -<br>Jumat</td>
            <td>09.00 -<br>22.00</td>
        </tr>

        <tr>
            <td>Sabtu -<br>Minggu</td>
            <td>10.00 -<br>24.00</td>
        </tr>

        <tr>
            <td colspan="2" class="catatan">
                Format waktu dalam<br>
                WIB
            </td>
        </tr>

    </table>

    <!-- FOOTER -->
    <div class="footer">
        Created by Zakhrofa Agniyaa @2026
    </div>

</body>
</html
